teleop:
  walk:
    type: topic
    message_type: geometry_msgs/Twist
    topic_name: cmd_vel
    # Simulation convenience: joystick commands are published without a deadman button.
    deadman_buttons: []
    axis_mappings:
      - axis: 3
        target: angular.z
        scale: 3.1415
      - axis: 1
        target: linear.x
        scale: 1.0
      - axis: 0
        target: linear.y
        scale: 0.5
