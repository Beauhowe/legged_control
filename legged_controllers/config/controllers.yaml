controller_manager:
  ros__parameters:
    # Must match mpc.mrtDesiredFrequency in task.info (default 1000 Hz).
    # Lower rates break in-place trot (lateral drift) unless task.info is updated too.
    update_rate: 500

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    legged_controller:
      type: legged/LeggedController

    legged_cheater_controller:
      type: legged/LeggedCheaterController

legged_controller:
  ros__parameters:
    imuName: base_imu

legged_cheater_controller:
  ros__parameters:
    imuName: base_imu
